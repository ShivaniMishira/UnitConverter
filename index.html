<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TOP SECTION.... -->
    <div class="top">
        <h1>Metric/Imperial Unit Conversion</h1>
        <input type="text" id="input">
        <button id="btn">Convet</button>

    </div>


    <!-- MIDDLE SECTION....  -->

    <div class="card">
        <div class="card-sub">
            <h3>Length (Meter/Feet) </h3>

            <div class="center">
                <div class="left" id="meter"></div>
                <div class="vi"></div>
                <div class="right" id="feet"></div>
            </div>
        </div>

        <div class="card-sub">
            <h3>Volume ( Liter/Gallons )</h3>
            <div class="center">
                <div class="left" id="liter"></div>
                <div class="vi"></div>
                <div class="right" id="gallons"></div>
            </div>
        </div>


        <div class="card-sub">
            <h3>Mass ( Kilograms/Pounds )</h3>
            <div class="center">
                <div class="left" id="kilo"></div>
                <div class="vi"></div>
                <div class="right" id="pounds"></div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
